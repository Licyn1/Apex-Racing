<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Replica - Unificado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://use.typekit.net/pyw3kic.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Saira+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="nav">
    <nav class="nav__links" aria-label="Navegación principal">
      <a href="#inicio" class="nav__link is-active">Inicio</a>
      <a href="#cursos" class="nav__link">Cursos</a>
      <a href="#contacto" class="nav__link">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="hero">

      <div class="grid-line grid-line--1" aria-hidden="true"></div>
      <div class="grid-line grid-line--2" aria-hidden="true"></div>

      <div class="hero__image-container">
        <img src="ruta-a-tu-imagen.jpg" alt="Piloto de sim racing gritando frente a un cockpit con triple monitor curvo mostrando una carrera" class="hero__image">
      </div>

      <div class="banner">
        <div class="banner__text">
          <h1 class="banner__title">
            <span class="line line--light">No jugás a correr.</span>
            <span class="line line--accent">Entrenás para competir.</span>
          </h1>
        </div>

        <div class="banner__cta">
          <a href="#cursos" class="cta">Ver cursos</a>
        </div>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
